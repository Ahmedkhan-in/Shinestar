[build]
  # Website lives in the npm workspace at apps/website; Netlify installs from the repo root
  base = "apps/website"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Next.js adapter: turns .next into routable pages + functions on Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"
